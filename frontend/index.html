<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VGAudiophile - Video Game Soundtrack Catalog</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 VGAudiophile</h1>
            <p class="subtitle">Video Game Soundtrack Catalog</p>
        </header>

        <nav class="tabs">
            <button class="tab-button active" data-tab="browse">Browse</button>
            <button class="tab-button" data-tab="scan">Scan</button>
            <button class="tab-button" data-tab="stats">Statistics</button>
        </nav>

        <!-- Browse Tab -->
        <div id="browse-tab" class="tab-content active">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Search soundtracks..." />
                <select id="release-type-filter">
                    <option value="">All Release Types</option>
                    <option value="game_rip">Game Rip</option>
                    <option value="remix_album">Remix Album</option>
                    <option value="online_album">Online Album</option>
                    <option value="official_release">Official Release</option>
                    <option value="other">Other</option>
                </select>
                <select id="source-type-filter">
                    <option value="">All Source Types</option>
                    <option value="file">File</option>
                    <option value="youtube">YouTube</option>
                    <option value="soundcloud">SoundCloud</option>
                </select>
                <select id="group-by-filter">
                    <option value="">No Grouping</option>
                    <option value="album">Group by Album</option>
                    <option value="folder">Group by Folder</option>
                </select>
                <button id="search-button">Search</button>
            </div>

            <div id="soundtracks-list" class="soundtracks-grid">
                <!-- Soundtracks will be loaded here -->
            </div>

            <div class="pagination">
                <button id="prev-page" disabled>Previous</button>
                <span id="page-info">Page 1</span>
                <button id="next-page">Next</button>
            </div>
        </div>

        <!-- Scan Tab -->
        <div id="scan-tab" class="tab-content">
            <div class="scan-section">
                <h2>Scan Directory</h2>
                <div class="form-group">
                    <label for="scan-directory">Directory Path:</label>
                    <input type="text" id="scan-directory" placeholder="/music" />
                    <button id="scan-button">Start Scan</button>
                </div>
                <div id="scan-status" class="scan-status"></div>
                <div class="admin-section" style="margin-top: 30px; padding-top: 30px; border-top: 2px solid #e0e0e0;">
                    <h3>Admin Tools</h3>
                    <div class="form-group">
                        <button id="clear-all-button" style="background: #d32f2f; padding: 12px 24px; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1em; font-weight: 500;">
                            Clear All Data
                        </button>
                        <p style="margin-top: 10px; color: #666; font-size: 0.9em;">
                            Warning: This will permanently delete all soundtracks, artists, tags, and scan history.
                        </p>
                    </div>
                </div>
                <div id="scan-history" class="scan-history">
                    <h3>Scan History</h3>
                    <div id="scan-history-list"></div>
                </div>
            </div>
        </div>

        <!-- Stats Tab -->
        <div id="stats-tab" class="tab-content">
            <div id="stats-content" class="stats-grid">
                <!-- Statistics will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Soundtrack Detail Modal -->
    <div id="soundtrack-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modal-title">Soundtrack Details</h2>
            <div id="modal-body">
                <!-- Details will be loaded here -->
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
